# Publica la carpeta web/ en Firebase Hosting cada vez que haces push a main.
#
# No necesitas Node ni la CLI de Firebase en tu equipo: todo ocurre en los
# servidores de GitHub. Requiere dos cosas configuradas una sola vez:
#   1. El Project ID puesto en .firebaserc
#   2. Un secreto FIREBASE_SERVICE_ACCOUNT en el repositorio
#      (Settings -> Secrets and variables -> Actions)
# Los pasos estan en DEPLOY.md.
name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El Project ID vive solo en .firebaserc, para no tener que escribirlo
      # en dos sitios y que se desincronicen.
      - name: Leer el Project ID de .firebaserc
        id: proyecto
        run: |
          ID=$(jq -r '.projects.default' .firebaserc)
          if [ -z "$ID" ] || [ "$ID" = "null" ] || [ "$ID" = "PON-AQUI-TU-PROJECT-ID" ]; then
            echo "::error::Falta el Project ID. Edita .firebaserc y pon el de tu proyecto de Firebase."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Desplegando en el proyecto: $ID"

      # Aviso temprano si se olvidó subir los datos: sin ellos la web sale vacía.
      - name: Comprobar que los datos de la web existen
        run: |
          test -f web/data/index.json || {
            echo "::error::Falta web/data/index.json. Ejecuta 'python pipeline/run.py' y commitea web/data/."
            exit 1
          }
          echo "Datos presentes: $(find web/data -name '*.json' | wc -l) ficheros JSON"

      - name: Desplegar
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.proyecto.outputs.id }}
          channelId: live
