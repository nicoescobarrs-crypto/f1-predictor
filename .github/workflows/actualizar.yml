name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROJECT_ID: f1-predictor-4c2a1

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar cache de FastF1
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-${{ github.run_id }}
          restore-keys: |
            fastf1-

      - name: Comprobar que el dataset viene en el repositorio
        run: |
          if [ ! -f data/raw_results.parquet ]; then
            echo "::error::Falta data/raw_results.parquet. Subelo al repositorio."
            exit 1
          fi
          ls -lh data/raw_results.parquet

      - name: Anotar el estado actual
        id: antes
        run: |
          N=$(python -c "import json;print(json.load(open('web/data/index.json'))['total_carreras'])" 2>/dev/null || echo 0)
          echo "carreras=$N" >> "$GITHUB_OUTPUT"
          echo "Carreras publicadas ahora: $N"

      - name: Descargar carreras nuevas y reentrenar
        run: python pipeline/run.py --refrescar --eventos 4

      - name: Comprobar que el dataset no ha encogido
        run: |
          ANTES=${{ steps.antes.outputs.carreras }}
          AHORA=$(python -c "import json;print(json.load(open('web/data/index.json'))['total_carreras'])")
          echo "Antes: $ANTES carreras | Ahora: $AHORA"
          if [ "$AHORA" -lt "$ANTES" ]; then
            echo "::error::El dataset ha pasado de $ANTES a $AHORA carreras. Probablemente se agoto la cuota de FastF1. NO se publica para no degradar la web. Relanza dentro de una hora: la descarga es incremental."
            exit 1
          fi

      - name: Comprobar si hay datos nuevos
        id: cambios
        run: |
          if [ -z "$(git status --porcelain web/data data/raw_results.parquet)" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: no se ha disputado ninguna carrera nueva."
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
            git status --short web/data data/raw_results.parquet
          fi

      - name: Commitear los datos nuevos
        id: commit
        if: steps.cambios.outputs.hay == 'si'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git add -f data/raw_results.parquet
          git commit -m "Actualizacion automatica de datos ($(date -u +%Y-%m-%d))"

          for intento in 1 2 3; do
            if git push; then
              echo "Push correcto en el intento $intento"
              exit 0
            fi
            echo "Push rechazado; reintegrando cambios remotos..."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::No se pudo hacer push tras 3 intentos."
          exit 1

      - name: Publicar en Firebase
        id: deploy
        if: steps.cambios.outputs.hay == 'si'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live

      - name: Resumen
        if: always()
        run: |
          if [ "${{ steps.commit.outcome }}" = "success" ] && [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "### Datos actualizados y web publicada" >> "$GITHUB_STEP_SUMMARY"
            echo "https://${{ env.PROJECT_ID }}.web.app" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.cambios.outputs.hay }}" = "si" ]; then
            echo "### Habia datos nuevos pero NO se publicaron" >> "$GITHUB_STEP_SUMMARY"
            echo "- commit: ${{ steps.commit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- despliegue: ${{ steps.deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.cambios.outputs.hay }}" = "no" ]; then
            echo "### Sin carreras nuevas: no habia nada que publicar" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### La ejecucion se detuvo antes de publicar" >> "$GITHUB_STEP_SUMMARY"
          fi
